# DTL Phase 2 – EfficientNet-B0 (domain-adapted backbone)
# Identical to the best aug_v2 config, but loads the Phase 1 checkpoint
# so the backbone starts from dermoscopy-adapted weights instead of raw ImageNet.
#
# Run Phase 1 first:
#   python -m Stage1.dtl_phase1 --config Stage1/configs/dtl_phase1_efficientnet.yaml
#
# Then run this:
#   python -m Stage1.train --config Stage1/configs/efficientnet_b0_dtl.yaml

seed: 42
epochs: 30
batch_size: 16
lr: 0.0003               # full lr for head (same as baseline)
backbone_lr_factor: 0.1  # backbone gets 1e-4 (10x lower) to preserve Phase 1 adaptation
weight_decay: 0.0001
img_size: 224
num_workers: 0
num_classes: 7

augment: true
use_weighted_sampler: true
sampler_power: 0.5
scheduler: cosine

# Load domain-adapted backbone weights from Phase 1
phase1_checkpoint: Stage1/checkpoints/dtl_phase1_efficientnet/phase1.pt

data:
  train_csv: Dataset/stage1_multiclass_train.csv
  val_csv: Dataset/stage1_multiclass_val.csv
  test_csv: Dataset/stage1_multiclass_test.csv
  data_root: .
  label_mapping: Dataset/label_mapping_multiclass.json

model:
  name: efficientnet_b0
  pretrained: true   # still load ImageNet weights; phase1_checkpoint then overwrites them

output:
  dir: Stage1/checkpoints/efficientnet_b0_dtl_v3
