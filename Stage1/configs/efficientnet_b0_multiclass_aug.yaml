seed: 42
epochs: 15
batch_size: 16
lr: 0.0003
weight_decay: 0.0001
img_size: 224
num_workers: 0
num_classes: 7

augment: true
use_weighted_sampler: true

data:
  train_csv: Dataset/stage1_multiclass_train.csv
  val_csv: Dataset/stage1_multiclass_val.csv
  test_csv: Dataset/stage1_multiclass_test.csv
  data_root: .
  label_mapping: Dataset/label_mapping_multiclass.json

model:
  name: efficientnet_b0
  pretrained: true

output:
  dir: Stage1/checkpoints/efficientnet_b0_multiclass_aug
