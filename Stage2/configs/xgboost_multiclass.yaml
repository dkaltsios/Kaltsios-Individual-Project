seed: 42
num_classes: 7

data:
  stage2_csv: Dataset/combined_stage2_multiclass.csv
  stage1_train_csv: Dataset/stage1_multiclass_train.csv
  stage1_val_csv: Dataset/stage1_multiclass_val.csv
  stage1_test_csv: Dataset/stage1_multiclass_test.csv
  label_mapping: Dataset/label_mapping_multiclass.json

model:
  name: xgboost
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 5
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  early_stopping_rounds: 50

output:
  dir: Stage2/checkpoints/xgboost_multiclass
  preprocessor_path: Stage2/checkpoints/xgboost_multiclass/preprocessor.joblib
