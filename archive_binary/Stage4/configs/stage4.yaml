# Stage 4 standalone: handcrafted image features + metadata -> binary (malignant/benign)
# No Stage 1 or Stage 2 required. Uses same data CSVs and combined_stage2 for metadata.
seed: 42
img_size: 128

data:
  data_root: .
  stage1_train_csv: Dataset/stage1_train.csv
  stage1_val_csv: Dataset/stage1_val.csv
  stage1_test_csv: Dataset/stage1_test.csv
  stage2_csv: Dataset/combined_stage2.csv
  label_col: y

output:
  dir: Stage4/checkpoints/stage4_standalone

model:
  name: xgboost
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 5
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  early_stopping_rounds: 50
