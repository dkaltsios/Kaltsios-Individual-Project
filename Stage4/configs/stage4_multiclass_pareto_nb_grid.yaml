# Grid search: Pareto features + Naive Bayes
seed: 42
num_classes: 7
img_size: 128
feature_extractor: pareto

feature_selection:
  keep_percent: 20

data:
  data_root: .
  stage1_train_csv: Dataset/stage1_multiclass_train.csv
  stage1_val_csv: Dataset/stage1_multiclass_val.csv
  stage1_test_csv: Dataset/stage1_multiclass_test.csv
  stage2_csv: Dataset/combined_stage2_multiclass.csv
  label_col: y_class
  label_mapping: Dataset/label_mapping_multiclass.json

output:
  dir: Stage4/checkpoints/stage4_multiclass_pareto_nb

model:
  name: naive_bayes
  base: {}

  param_grid:
    var_smoothing: [1e-12, 1e-11, 1e-10, 1e-9, 1e-8, 1e-7, 1e-6, 1e-5]

cv:
  n_splits: 5
  metric: f1_macro
