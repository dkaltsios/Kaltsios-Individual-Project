# Stage 4 multiclass: handcrafted image features + metadata -> 7 lesion types
seed: 42
num_classes: 7
img_size: 128

data:
  data_root: .
  stage1_train_csv: Dataset/stage1_multiclass_train.csv
  stage1_val_csv: Dataset/stage1_multiclass_val.csv
  stage1_test_csv: Dataset/stage1_multiclass_test.csv
  stage2_csv: Dataset/combined_stage2_multiclass.csv
  label_col: y_class
  label_mapping: Dataset/label_mapping_multiclass.json

output:
  dir: Stage4/checkpoints/stage4_multiclass

model:
  name: xgboost
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 5
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  early_stopping_rounds: 50
