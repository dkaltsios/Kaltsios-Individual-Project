# Stage 4 multiclass: 13 image features + metadata -> Gaussian Naive Bayes -> 7 lesion types
seed: 42
num_classes: 7
img_size: 128

data:
  data_root: .
  stage1_train_csv: Dataset/stage1_multiclass_train.csv
  stage1_val_csv: Dataset/stage1_multiclass_val.csv
  stage1_test_csv: Dataset/stage1_multiclass_test.csv
  stage2_csv: Dataset/combined_stage2_multiclass.csv
  label_col: y_class
  label_mapping: Dataset/label_mapping_multiclass.json

output:
  dir: Stage4/checkpoints/stage4_multiclass_nb

model:
  name: naive_bayes
  var_smoothing: 1e-9
