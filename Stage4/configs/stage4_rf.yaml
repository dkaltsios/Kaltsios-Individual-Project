# Stage 4 standalone: handcrafted image features + metadata -> binary
seed: 42
img_size: 128

data:
  data_root: .
  stage1_train_csv: Dataset/stage1_train.csv
  stage1_val_csv: Dataset/stage1_val.csv
  stage1_test_csv: Dataset/stage1_test.csv
  stage2_csv: Dataset/combined_stage2.csv
  label_col: y

output:
  dir: Stage4/checkpoints/stage4_standalone_rf

model:
  name: random_forest
  n_estimators: 500
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt
  class_weight: balanced
